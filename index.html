<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>越港生活圈場地預約瀏覽</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f8f9fa; font-family: "Microsoft JhengHei", sans-serif; }
    .header-title { background: #1e3a8a; color: white; padding: 15px 0; text-align: center; }
    
    /* 篩選列樣式 */
    .filter-bar { background-color: #f1f1f1; padding: 10px 15px; border-radius: 5px; margin-bottom: 15px; font-weight: bold; }
    
    /* 矩陣表格風格 */
    .matrix-table { border-collapse: collapse; width: 100%; background-color: white; }
    .matrix-table th { background-color: #555100; color: white; text-align: center; vertical-align: middle; padding: 12px 6px; border: 1px solid #3d3a00; font-size: 0.95rem; }
    .matrix-table td { border: 1px solid #cccccc; vertical-align: top; padding: 6px; min-width: 130px; height: 90px; }
    .date-cell { text-align: center; vertical-align: middle !important; font-weight: bold; background-color: #f9f9f9; width: 110px; min-width: 110px; color: #333; }
    
    /* 預約卡片樣式 */
    .res-card { border: 1px solid #b8a38a; background-color: #efebe0; border-radius: 3px; margin-bottom: 6px; cursor: pointer; transition: transform 0.1s; }
    .res-card:hover { transform: scale(1.02); box-shadow: 0 2px 5px rgba(0,0,0,0.15); }
    .res-slot-header { background-color: #8a8352; color: white; text-align: center; font-size: 0.8rem; padding: 2px 0; font-weight: bold; }
    .res-slot-header.slot-full { background-color: #8a8352; } /* 全天 */
    .res-slot-header.slot-morning { background-color: #6b8e23; } /* 上午 */
    .res-slot-header.slot-afternoon { background-color: #d2691e; } /* 下午 */
    .res-body { padding: 5px; font-size: 0.82rem; color: #222; text-align: center; word-break: break-all; }
  </style>
</head>
<body>

  <div class="header-title">
    <h2>越港生活圈場地預約瀏覽</h2>
  </div>

  <div class="container-fluid my-3 px-4">
    <!-- 功能分頁切換 -->
    <ul class="nav nav-tabs mb-3" id="mainTab" role="tablist">
      <li class="nav-item">
        <button class="nav-link active" id="calendar-tab" data-bs-toggle="tab" data-bs-target="#calendar-view" type="button">📅 場地預約矩陣表</button>
      </li>
      <li class="nav-item">
        <button class="nav-link" id="admin-tab" data-bs-toggle="tab" data-bs-target="#admin-view" type="button">⚙️ 後台管理專區</button>
      </li>
    </ul>

    <div class="tab-content" id="mainTabContent">
      
      <!-- 1. 矩陣式預約狀況圖表 -->
      <div class="tab-pane fade show active" id="calendar-view">
        <div class="filter-bar d-flex align-items-center gap-2">
          <span>查詢條件</span>
          <label class="ms-3">年度：</label>
          <select id="yearSelect" class="form-select form-select-sm" style="width: 100px;" onchange="renderMatrixCalendar()"></select>
          <label class="ms-2">月份：</label>
          <select id="monthSelect" class="form-select form-select-sm" style="width: 80px;" onchange="renderMatrixCalendar()"></select>
          <button class="btn btn-sm btn-primary ms-3" onclick="loadReservations()">🔄 重新整理</button>
        </div>

        <div class="table-responsive">
          <table class="matrix-table">
            <thead>
              <tr id="matrixHeader"></tr>
            </thead>
            <tbody id="matrixBody"></tbody>
          </table>
        </div>
      </div>

      <!-- 2. 管理專區 (依身分差別顯示) -->
      <div class="tab-pane fade" id="admin-view">
        <!-- 登入表單 -->
        <div id="adminLoginForm" class="card mx-auto my-4" style="max-width: 400px;">
          <div class="card-body">
            <h5 class="card-title text-center">系統使用者登入</h5>
            <div class="mb-3">
              <label>帳號</label>
              <input type="text" id="loginUser" class="form-control" placeholder="請輸入帳號" required>
            </div>
            <div class="mb-3">
              <label>密碼</label>
              <input type="password" id="loginPwd" class="form-control" placeholder="請輸入密碼" required>
            </div>
            <button class="btn btn-primary w-100" onclick="login()">登入系統</button>
          </div>
        </div>

        <!-- 管理操作面板 (登入後顯示) -->
        <div id="adminPanel" class="d-none my-3">
          <div class="d-flex justify-content-between align-items-center mb-3 pb-2 border-bottom">
            <h4 class="mb-0">
              <span id="roleTitleText">管理者功能</span>
              <span class="badge bg-primary ms-2 fs-6" id="userDisplayTag"></span>
            </h4>
            <button class="btn btn-sm btn-outline-danger" onclick="logout()">安全登出</button>
          </div>

          <ul class="nav nav-pills mb-3">
            <li class="nav-item">
              <button class="nav-link active" data-bs-toggle="pill" data-bs-target="#pills-res">預約資料管理</button>
            </li>
            <li class="nav-item">
              <button class="nav-link" data-bs-toggle="pill" data-bs-target="#pills-user">帳號密碼管理</button>
            </li>
          </ul>

          <div class="tab-content">
            <!-- 預約資料管理 -->
            <div class="tab-pane fade show active" id="pills-res">
              <div class="mb-3">
                <button class="btn btn-success me-2" onclick="openResModal()">+ 單次新增預約</button>
                <button class="btn btn-primary" onclick="openRecurringModal()">🔁 長期/週期性預約</button>
              </div>
              <table class="table table-striped table-hover align-middle">
                <thead>
                  <tr><th>日期</th><th>時段</th><th>場地</th><th>申請人</th><th>用途</th><th>操作</th></tr>
                </thead>
                <tbody id="adminResTable"></tbody>
              </table>
            </div>

            <!-- 帳號密碼管理 -->
            <div class="tab-pane fade" id="pills-user">
              <div class="mb-3">
                <button id="addUserBtn" class="btn btn-success" onclick="openUserModal()">+ 新增帳號</button>
              </div>
              <table class="table table-striped table-hover align-middle">
                <thead>
                  <tr><th>帳號</th><th>角色權限</th><th>操作</th></tr>
                </thead>
                <tbody id="adminUserTable"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- 詳細資料 Modal -->
  <div class="modal fade" id="detailModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header bg-primary text-white">
          <h5 class="modal-title" id="detailVenue">場地預約詳細內容</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <p><strong>預約日期：</strong> <span id="detailDate"></span></p>
          <p><strong>預約時段：</strong> <span id="detailSlot"></span></p>
          <p><strong>申請單位/人：</strong> <span id="detailUser"></span></p>
          <p><strong>聯絡電話：</strong> <span id="detailPhone"></span></p>
          <p><strong>使用用途：</strong> <span id="detailPurpose"></span></p>
        </div>
      </div>
    </div>
  </div>

  <!-- 單次預約 Modal -->
  <div class="modal fade" id="resEditModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="resModalTitle">新增/修改預約</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="alert alert-warning py-2 mb-3" style="font-size: 0.85rem;">
            <strong>⚠️ 系統限制：</strong>僅開放預約即日起<b>一年內</b>的場地。
          </div>
          <form id="resForm">
            <input type="hidden" id="resId">
            <div class="mb-2">
              <label>申請人/帳號</label>
              <input type="text" id="resUsername" class="form-control" required>
            </div>
            <div class="mb-2">
              <label>場地</label>
              <select id="resVenue" class="form-select" required>
                <option value="智慧中心會議室（20）">智慧中心會議室（20）</option>
                <option value="準備教室B（40）">準備教室B（40）</option>
                <option value="電腦教室（25）">電腦教室（25）</option>
                <option value="視聽教室（90）">視聽教室（90）</option>
                <option value="廚房多功教室（40）">廚房多功教室（40）</option>
                <option value="前庭停車場（30）">前庭停車場（30）</option>
              </select>
            </div>
            <div class="mb-2">
              <label>日期</label>
              <input type="date" id="resDate" class="form-control" required>
            </div>
            <div class="mb-2">
              <label>時段</label>
              <select id="resSlot" class="form-select" required>
                <option value="全天">全天</option>
                <option value="上午">上午</option>
                <option value="下午">下午</option>
              </select>
            </div>
            <div class="mb-2">
              <label>聯絡電話</label>
              <input type="text" id="resPhone" class="form-control">
            </div>
            <div class="mb-2">
              <label>用途說明</label>
              <textarea id="resPurpose" class="form-control" rows="2"></textarea>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-primary" onclick="saveReservation()">儲存預約</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 長期/週期預約 Modal -->
  <div class="modal fade" id="recurringModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header bg-primary text-white">
          <h5 class="modal-title">🔁 長期/週期性預約設定</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="alert alert-danger fw-bold mb-3">
            ⚠️ 提示與防呆機制：系統僅開放預約即日起【一年內】的場地，超過一年的日期將無法成功送出！
          </div>
          <form id="recurringForm">
            <div class="row">
              <div class="col-md-6 mb-2">
                <label class="fw-bold">申請人/帳號</label>
                <input type="text" id="recUsername" class="form-control" required>
              </div>
              <div class="col-md-6 mb-2">
                <label class="fw-bold">場地</label>
                <select id="recVenue" class="form-select" required>
                  <option value="智慧中心會議室（20）">智慧中心會議室（20）</option>
                  <option value="準備教室B（40）">準備教室B（40）</option>
                  <option value="電腦教室（25）">電腦教室（25）</option>
                  <option value="視聽教室（90）">視聽教室（90）</option>
                  <option value="廚房多功教室（40）">廚房多功教室（40）</option>
                  <option value="前庭停車場（30）">前庭停車場（30）</option>
                </select>
              </div>
            </div>

            <div class="row">
              <div class="col-md-6 mb-2">
                <label class="fw-bold">開始日期</label>
                <input type="date" id="recStartDate" class="form-control" required>
              </div>
              <div class="col-md-6 mb-2">
                <label class="fw-bold">結束日期</label>
                <input type="date" id="recEndDate" class="form-control" required>
              </div>
            </div>

            <div class="mb-3">
              <label class="fw-bold d-block">重複星期 (可多選)</label>
              <div class="form-check form-check-inline">
                <input class="form-check-input rec-day" type="checkbox" value="1" id="day1"><label class="form-check-label" for="day1">週一</label>
              </div>
              <div class="form-check form-check-inline">
                <input class="form-check-input rec-day" type="checkbox" value="2" id="day2"><label class="form-check-label" for="day2">週二</label>
              </div>
              <div class="form-check form-check-inline">
                <input class="form-check-input rec-day" type="checkbox" value="3" id="day3"><label class="form-check-label" for="day3">週三</label>
              </div>
              <div class="form-check form-check-inline">
                <input class="form-check-input rec-day" type="checkbox" value="4" id="day4"><label class="form-check-label" for="day4">週四</label>
              </div>
              <div class="form-check form-check-inline">
                <input class="form-check-input rec-day" type="checkbox" value="5" id="day5"><label class="form-check-label" for="day5">週五</label>
              </div>
              <div class="form-check form-check-inline">
                <input class="form-check-input rec-day" type="checkbox" value="6" id="day6"><label class="form-check-label" for="day6">週六</label>
              </div>
              <div class="form-check form-check-inline">
                <input class="form-check-input rec-day" type="checkbox" value="0" id="day0"><label class="form-check-label" for="day0">週日</label>
              </div>
            </div>

            <div class="row">
              <div class="col-md-6 mb-2">
                <label class="fw-bold">時段</label>
                <select id="recSlot" class="form-select" required>
                  <option value="全天">全天</option>
                  <option value="上午">上午</option>
                  <option value="下午">下午</option>
                </select>
              </div>
              <div class="col-md-6 mb-2">
                <label class="fw-bold">聯絡電話</label>
                <input type="text" id="recPhone" class="form-control">
              </div>
            </div>

            <div class="mb-2">
              <label class="fw-bold">用途說明</label>
              <textarea id="recPurpose" class="form-control" rows="2" placeholder="例：音樂課"></textarea>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-primary" id="saveRecBtn" onclick="saveRecurringReservation()">送出批次預約</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 帳號編輯 Modal -->
  <div class="modal fade" id="userEditModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="userModalTitle">編輯帳號與密碼</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="userForm">
            <div class="mb-2">
              <label>帳號</label>
              <input type="text" id="accUsername" class="form-control" required>
            </div>
            <div class="mb-2">
              <label>新密碼</label>
              <input type="text" id="accPassword" class="form-control" placeholder="請輸入新密碼" required>
            </div>
            <div class="mb-2">
              <label>角色權限</label>
              <select id="accRole" class="form-select">
                <option value="admin">管理者 (admin)</option>
                <option value="user">一般使用者 (user)</option>
              </select>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-primary" onclick="saveUser()">儲存變更</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // ⚠️ 請修改為您的 GAS 部署網址
    const GAS_URL = "https://script.google.com/macros/s/AKfycbzL5Nf4jAtM-1b5zC9K6r_3wK5nO/exec"; // 請替換為真實部署ID
    
    const VENUES = [
      "智慧中心會議室（20）",
      "準備教室B（40）",
      "電腦教室（25）",
      "視聽教室（90）",
      "廚房多功教室（40）",
      "前庭停車場（30）"
    ];

    const WEEK_DAYS = ["星期日", "星期一", "星期二", "星期三", "星期四", "星期五", "星期六"];
    let reservationsData = [];
    let currentUser = { username: '', role: '' };
    let isEditingUser = false;

    window.onload = function() {
      initDropdowns();
      loadReservations();
    };

    function initDropdowns() {
      const yearSelect = document.getElementById('yearSelect');
      const monthSelect = document.getElementById('monthSelect');
      const now = new Date();
      const currentYear = now.getFullYear();
      const currentMonth = now.getMonth() + 1;

      yearSelect.innerHTML = '';
      for (let y = currentYear - 1; y <= currentYear + 2; y++) {
        let opt = document.createElement('option');
        opt.value = y;
        opt.innerText = y;
        if (y === currentYear) opt.selected = true;
        yearSelect.appendChild(opt);
      }

      monthSelect.innerHTML = '';
      for (let m = 1; m <= 12; m++) {
        let opt = document.createElement('option');
        let mStr = String(m).padStart(2, '0');
        opt.value = mStr;
        opt.innerText = mStr;
        if (m === currentMonth) opt.selected = true;
        monthSelect.appendChild(opt);
      }
    }

    function loadReservations() {
      fetch(GAS_URL)
        .then(res => res.json())
        .then(res => {
          if(res.status === 'success') {
            reservationsData = res.data;
            renderMatrixCalendar();
            if(!document.getElementById('adminPanel').classList.contains('d-none')) {
              renderAdminResTable();
            }
          } else {
            alert("載入失敗：" + res.message);
          }
        })
        .catch(err => console.error("API Error:", err));
    }

    function renderMatrixCalendar() {
      const selYear = parseInt(document.getElementById('yearSelect').value);
      const selMonth = parseInt(document.getElementById('monthSelect').value);
      
      const theadTr = document.getElementById('matrixHeader');
      theadTr.innerHTML = '<th>日期</th>';
      VENUES.forEach(v => {
        let th = document.createElement('th');
        th.innerText = v;
        theadTr.appendChild(th);
      });

      const daysInMonth = new Date(selYear, selMonth, 0).getDate();
      const tbody = document.getElementById('matrixBody');
      tbody.innerHTML = '';

      for (let day = 1; day <= daysInMonth; day++) {
        const tr = document.createElement('tr');
        const dateObj = new Date(selYear, selMonth - 1, day);
        const monthStr = String(selMonth).padStart(2, '0');
        const dayStr = String(day).padStart(2, '0');
        const dateStr = `${selYear}-${monthStr}-${dayStr}`;
        const weekDayStr = WEEK_DAYS[dateObj.getDay()];

        const dateTd = document.createElement('td');
        dateTd.className = 'date-cell';
        dateTd.innerText = `${monthStr}-${dayStr} ${weekDayStr}`;
        tr.appendChild(dateTd);

        VENUES.forEach(v => {
          const td = document.createElement('td');
          const matches = reservationsData.filter(r => r.date === dateStr && r.venue === v);
          
          matches.forEach(item => {
            const card = document.createElement('div');
            card.className = 'res-card';
            
            let slotClass = 'slot-full';
            if (item.slot === '上午') slotClass = 'slot-morning';
            if (item.slot === '下午') slotClass = 'slot-afternoon';

            card.innerHTML = `
              <div class="res-slot-header ${slotClass}">${item.slot}</div>
              <div class="res-body">${item.purpose || item.username}</div>
            `;
            card.onclick = function() { showDetail(item); };
            td.appendChild(card);
          });

          tr.appendChild(td);
        });

        tbody.appendChild(tr);
      }
    }

    function showDetail(item) {
      document.getElementById('detailVenue').innerText = item.venue;
      document.getElementById('detailDate').innerText = item.date;
      document.getElementById('detailSlot').innerText = item.slot;
      document.getElementById('detailUser').innerText = item.username;
      document.getElementById('detailPhone').innerText = item.phone || '無';
      document.getElementById('detailPurpose').innerText = item.purpose || '無';
      new bootstrap.Modal(document.getElementById('detailModal')).show();
    }

    // 登入驗證與身份判定
    function login() {
      const u = document.getElementById('loginUser').value;
      const p = document.getElementById('loginPwd').value;
      
      if(!u || !p) {
        alert("請輸入帳號與密碼！");
        return;
      }

      fetch(GAS_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'login', username: u, password: p })
      }).then(r => r.json()).then(res => {
        if(res.data && res.data.success) {
          currentUser.username = res.data.username;
          currentUser.role = res.data.role;

          document.getElementById('adminLoginForm').classList.add('d-none');
          document.getElementById('adminPanel').classList.remove('d-none');
          
          const isAdmin = currentUser.role === 'admin';
          
          // 1. 顯示身份提示
          document.getElementById('roleTitleText').innerText = isAdmin ? "管理者功能" : "使用者功能";
          document.getElementById('userDisplayTag').innerText = `登入者：${currentUser.username} (${isAdmin ? '系統管理者' : '一般使用者'})`;

          // 2. 依身份調整按鈕顯示
          if (!isAdmin) {
            document.getElementById('addUserBtn').classList.add('d-none');
          } else {
            document.getElementById('addUserBtn').classList.remove('d-none');
          }

          renderAdminResTable();
          loadUsers();
        } else {
          alert('登入失敗，請確認帳號密碼！');
        }
      });
    }

    function logout() {
      currentUser = { username: '', role: '' };
      document.getElementById('adminLoginForm').classList.remove('d-none');
      document.getElementById('adminPanel').classList.add('d-none');
      document.getElementById('loginUser').value = '';
      document.getElementById('loginPwd').value = '';
    }

    // 渲染後台預約資料 (過濾身份)
    function renderAdminResTable() {
      const tbody = document.getElementById('adminResTable');
      tbody.innerHTML = '';
      
      // 區分身份：admin 可看全部預約，user 只能看到自己的預約
      let displayData = reservationsData;
      if (currentUser.role !== 'admin') {
        displayData = reservationsData.filter(r => r.username === currentUser.username);
      }

      if (displayData.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted">目前尚無預約紀錄</td></tr>';
        return;
      }

      displayData.forEach(r => {
        let tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${r.date}</td>
          <td><span class="badge bg-secondary">${r.slot}</span></td>
          <td>${r.venue}</td>
          <td>${r.username}</td>
          <td>${r.purpose}</td>
          <td>
            <button class="btn btn-sm btn-warning" onclick='editRes(${JSON.stringify(r)})'>修改</button>
            <button class="btn btn-sm btn-danger" onclick='deleteRes("${r.id}")'>刪除</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    function openResModal() {
      document.getElementById('resForm').reset();
      document.getElementById('resId').value = '';
      document.getElementById('resModalTitle').innerText = "新增預約";
      
      // 自動帶入申請人，一般使用者鎖定不給修改
      const userInput = document.getElementById('resUsername');
      userInput.value = currentUser.username;
      userInput.readOnly = (currentUser.role !== 'admin');

      new bootstrap.Modal(document.getElementById('resEditModal')).show();
    }

    function openRecurringModal() {
      document.getElementById('recurringForm').reset();

      // 自動帶入申請人，一般使用者鎖定不給修改
      const userInput = document.getElementById('recUsername');
      userInput.value = currentUser.username;
      userInput.readOnly = (currentUser.role !== 'admin');

      new bootstrap.Modal(document.getElementById('recurringModal')).show();
    }

    function editRes(r) {
      document.getElementById('resId').value = r.id;
      document.getElementById('resUsername').value = r.username;
      document.getElementById('resVenue').value = r.venue;
      document.getElementById('resDate').value = r.date;
      document.getElementById('resSlot').value = r.slot;
      document.getElementById('resPhone').value = r.phone;
      document.getElementById('resPurpose').value = r.purpose;
      
      const userInput = document.getElementById('resUsername');
      userInput.readOnly = (currentUser.role !== 'admin');

      document.getElementById('resModalTitle').innerText = "修改預約";
      new bootstrap.Modal(document.getElementById('resEditModal')).show();
    }

    function checkIsWithinOneYear(dateString) {
      const inputDate = new Date(dateString);
      const today = new Date();
      const maxDate = new Date();
      maxDate.setFullYear(today.getFullYear() + 1);

      inputDate.setHours(0,0,0,0);
      today.setHours(0,0,0,0);
      maxDate.setHours(23,59,59,999);

      return inputDate <= maxDate;
    }

    function saveReservation() {
      const dateVal = document.getElementById('resDate').value;
      if (!checkIsWithinOneYear(dateVal)) {
        alert("⚠️ 防呆警告：系統僅開放預約一年內的場地！");
        return;
      }

      const data = {
        id: document.getElementById('resId').value,
        username: document.getElementById('resUsername').value,
        venue: document.getElementById('resVenue').value,
        date: dateVal,
        slot: document.getElementById('resSlot').value,
        phone: document.getElementById('resPhone').value,
        purpose: document.getElementById('resPurpose').value
      };
      const act = data.id ? 'updateReservation' : 'addReservation';

      fetch(GAS_URL, {
        method: 'POST',
        body: JSON.stringify({ action: act, data: data })
      }).then(r => r.json()).then(res => {
        alert(res.message);
        bootstrap.Modal.getInstance(document.getElementById('resEditModal')).hide();
        loadReservations();
      });
    }

    function saveRecurringReservation() {
      const startDate = document.getElementById('recStartDate').value;
      const endDate = document.getElementById('recEndDate').value;

      if (!startDate || !endDate) {
        alert("請選擇完整的開始與結束日期！");
        return;
      }

      if (!checkIsWithinOneYear(startDate) || !checkIsWithinOneYear(endDate)) {
        alert("⚠️ 防呆警告：系統僅開放預約一年內的場地，結束日期不可超過一年後！");
        return;
      }

      const daysOfWeek = [];
      document.querySelectorAll('.rec-day:checked').forEach(cb => {
        daysOfWeek.push(cb.value);
      });

      if (daysOfWeek.length === 0) {
        alert("請至少勾選一個重複的星期（例如：週三）！");
        return;
      }

      const btn = document.getElementById('saveRecBtn');
      btn.disabled = true;
      btn.innerText = "資料處理中...";

      const data = {
        username: document.getElementById('recUsername').value,
        venue: document.getElementById('recVenue').value,
        startDate: startDate,
        endDate: endDate,
        daysOfWeek: daysOfWeek,
        slot: document.getElementById('recSlot').value,
        phone: document.getElementById('recPhone').value,
        purpose: document.getElementById('recPurpose').value
      };

      fetch(GAS_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'addRecurringReservations', data: data })
      }).then(r => r.json()).then(res => {
        alert(res.message);
        btn.disabled = false;
        btn.innerText = "送出批次預約";
        if (res.status === 'success') {
          bootstrap.Modal.getInstance(document.getElementById('recurringModal')).hide();
          loadReservations();
        }
      }).catch(err => {
        alert("發生錯誤：" + err);
        btn.disabled = false;
        btn.innerText = "送出批次預約";
      });
    }

    function deleteRes(id) {
      if(!confirm("確定要刪除這筆預約嗎？")) return;
      fetch(GAS_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'deleteReservation', id: id })
      }).then(r => r.json()).then(res => {
        alert(res.message);
        loadReservations();
      });
    }

    // 帳號密碼管理 (過濾身份)
    function loadUsers() {
      fetch(GAS_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'getUsers' })
      }).then(r => r.json()).then(res => {
        if(res.status === 'success') {
          const tbody = document.getElementById('adminUserTable');
          tbody.innerHTML = '';
          
          let usersList = res.data;
          // 一般使用者只能看到自己的帳號
          if (currentUser.role !== 'admin') {
            usersList = usersList.filter(u => u.username === currentUser.username);
          }

          usersList.forEach(u => {
            let tr = document.createElement('tr');
            let actionBtns = `<button class="btn btn-sm btn-warning" onclick='editUser(${JSON.stringify(u)})'>修改密碼</button>`;

            // 管理者可看到刪除按鈕
            if (currentUser.role === 'admin') {
              actionBtns += ` <button class="btn btn-sm btn-danger" onclick='deleteUser("${u.username}")'>刪除</button>`;
            }

            tr.innerHTML = `
              <td>${u.username}</td>
              <td><span class="badge ${u.role === 'admin' ? 'bg-danger' : 'bg-info'}">${u.role === 'admin' ? '系統管理者' : '一般使用者'}</span></td>
              <td>${actionBtns}</td>
            `;
            tbody.appendChild(tr);
          });
        }
      });
    }

    function openUserModal() {
      isEditingUser = false;
      document.getElementById('userForm').reset();
      document.getElementById('accUsername').readOnly = false;
      document.getElementById('accRole').disabled = false;
      document.getElementById('userModalTitle').innerText = "新增帳號";
      new bootstrap.Modal(document.getElementById('userEditModal')).show();
    }

    function editUser(u) {
      isEditingUser = true;
      document.getElementById('accUsername').value = u.username;
      document.getElementById('accUsername').readOnly = true;
      document.getElementById('accPassword').value = u.password;
      document.getElementById('accRole').value = u.role;

      // 一般使用者禁止修改角色權限
      document.getElementById('accRole').disabled = (currentUser.role !== 'admin');

      document.getElementById('userModalTitle').innerText = "修改密碼";
      new bootstrap.Modal(document.getElementById('userEditModal')).show();
    }

    function saveUser() {
      const data = {
        username: document.getElementById('accUsername').value,
        password: document.getElementById('accPassword').value,
        role: document.getElementById('accRole').value
      };
      const act = isEditingUser ? 'updateUser' : 'addUser';

      fetch(GAS_URL, {
        method: 'POST',
        body: JSON.stringify({ action: act, data: data })
      }).then(r => r.json()).then(res => {
        alert(res.message);
        bootstrap.Modal.getInstance(document.getElementById('userEditModal')).hide();
        loadUsers();
      });
    }

    function deleteUser(username) {
      if(!confirm(`確定要刪除帳號 ${username} 嗎？`)) return;
      fetch(GAS_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'deleteUser', username: username })
      }).then(r => r.json()).then(res => {
        alert(res.message);
        loadUsers();
      });
    }
  </script>
</body>
</html>
